services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: geo3d
      POSTGRES_PASSWORD: geo3d
      POSTGRES_DB: geo3d
    ports:
      - "5433:5432"
    volumes:
      - geo3d-db:/var/lib/postgresql/data

  # Optional S3-compatible storage for testing STORAGE_DRIVER=s3
  minio:
    image: minio/minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - geo3d-minio:/data

volumes:
  geo3d-db:
  geo3d-minio:
